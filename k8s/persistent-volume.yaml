apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-prime-pvc
  namespace: codex-prime
  labels:
    app: codex-prime
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
