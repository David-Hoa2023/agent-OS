version: '3.8'

services:
  # Codex Prime API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-prime-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CODEX_PRIME_HOME=/home/codex/.codex_prime
      - DATABASE_URL=postgresql://codex:codexprime@postgres:5432/codexprime
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - codex-data:/home/codex/.codex_prime
      - ./personas:/app/personas:ro
      - ./examples:/app/examples:ro
    depends_on:
      - postgres
      - redis
    networks:
      - codex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Server for Real-Time Collaboration
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-prime-websocket
    command: ["python", "-m", "codex_prime.collaboration.websocket_server", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - codex-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codex-prime-postgres
    environment:
      - POSTGRES_USER=codex
      - POSTGRES_PASSWORD=codexprime
      - POSTGRES_DB=codexprime
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: codex-prime-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - codex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB for vector storage
  chromadb:
    image: chromadb/chroma:latest
    container_name: codex-prime-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - codex-network
    restart: unless-stopped

  # Web UI (React Frontend)
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: codex-prime-web
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8001
    depends_on:
      - api
    networks:
      - codex-network
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: codex-prime-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - codex-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: codex-prime-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - codex-network
    restart: unless-stopped

volumes:
  codex-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  codex-network:
    driver: bridge
